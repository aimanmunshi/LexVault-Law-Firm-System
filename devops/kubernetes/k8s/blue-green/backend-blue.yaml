# Backend (blue). IMAGE_PLACEHOLDER is replaced by deploy.sh with the build's image tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lawfirm-backend-blue
  namespace: lawfirm
  labels:
    app: lawfirm-backend
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lawfirm-backend
      version: blue
  template:
    metadata:
      labels:
        app: lawfirm-backend
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: production
            - name: JWT_EXPIRES_IN
              value: "7d"
            - name: UPLOAD_DIR
              value: ./uploads
            - name: MAX_FILE_SIZE
              value: "10485760"
          envFrom:
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-pvc
